# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal: verify Racket CS builds and runs on native Windows arm64 (tarm64nt), at
# parity with the x86_64 Windows build. Note: librktcrypto is intentionally
# excluded from ALL Windows builds (build.zuo: its C needs __int128 / non-MSVC
# features), so ssl-available? is #f on every Windows arch and HTTPS goes through
# win32-ssl (Schannel). This PoC therefore checks: builds, racket runs, and a
# real HTTPS request works via win32-ssl on arm64. No installer, no publish.

name: poc windows arm64

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-windows-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc-build-arm64:
    name: poc build windows arm64
    runs-on: windows-11-arm
    permissions:
      contents: read
    env:
      SOURCE_VERSION: '9.3.1'
      SOURCE_URL: 'https://github.com/CutieDeng/racket/releases/download/v9.3.1/racket-minimal-9.3.1-src.tgz'
      SOURCE_SHA256: '82c5ea4c2e406b14b69ff7255ee34358f4abb0c1eee635e256562a0ca816f85d'
      BUILD_JOBS: '2'
      MSVC_ARCH: 'arm64'
      NMAKE_TARGET: 'plain-install'
    steps:
      - name: Locate Visual Studio build tools
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw "Visual Studio was not found" }
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsall)) { throw "vcvarsall.bat not found: $vcvarsall" }
          "VCVARSALL_BAT=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Report which arch build tools are present (arm64 target support).
          $vc = Join-Path $vs "VC\Tools\MSVC"
          if (Test-Path $vc) {
            Get-ChildItem $vc | ForEach-Object {
              $arm = Join-Path $_.FullName "bin\Hostarm64\arm64\cl.exe"
              $armx = Join-Path $_.FullName "bin\Hostx64\arm64\cl.exe"
              Write-Host ("MSVC {0}: Hostarm64/arm64 cl.exe={1} Hostx64/arm64 cl.exe={2}" -f $_.Name, (Test-Path $arm), (Test-Path $armx))
            }
          }

      - name: Download and verify source archive
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source | Out-Null
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source.tgz
          $actual = (Get-FileHash source.tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) { throw "Source sha256 mismatch: expected $env:SOURCE_SHA256 got $actual" }
          tar -xzf source.tgz -C source
          $entries = @(Get-ChildItem source -Directory)
          if ($entries.Count -ne 1) { Get-ChildItem source | Format-Table -AutoSize; throw "source archive must contain exactly one top-level directory" }
          "SRC_DIR=$($entries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Racket with nmake (arm64 / tarm64nt)
        shell: pwsh
        run: |
          $buildScript = @"
          @echo on
          call "%VCVARSALL_BAT%" %MSVC_ARCH%
          cd /d "%SRC_DIR%"
          if exist Makefile (
            echo Reusing existing top-level Makefile in %CD%
          ) else if exist src\winfig.bat (
            call src\winfig.bat
            if not exist Makefile ( echo winfig.bat did not create Makefile & dir & exit /b 1 )
          ) else (
            dir & echo Neither top-level Makefile nor src\winfig.bat exists & exit /b 1
          )
          type Makefile | findstr /I "MACH="
          for %%D in (bin lib share include etc) do ( if not exist "%%D" mkdir "%%D" )
          call :RunNmake all
          if errorlevel 1 exit /b %errorlevel%
          if /I "%NMAKE_TARGET%"=="all" goto after_nmake
          call :RunNmake %NMAKE_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          goto after_nmake
          :RunNmake
          echo Running nmake target %*
          nmake /f Makefile %* JOBS=%BUILD_JOBS%
          exit /b %errorlevel%
          :after_nmake
          "@
          Set-Content -Path build-racket.cmd -Value $buildScript -Encoding ASCII
          cmd.exe /c build-racket.cmd
          if ($LASTEXITCODE -ne 0) {
            if ($env:SRC_DIR) {
              Write-Host "Source root after failed nmake:"
              Get-ChildItem $env:SRC_DIR -Force | Select-Object -First 80 Mode, Length, FullName
              Get-ChildItem $env:SRC_DIR -Recurse -Filter libracketcs*.dll -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            }
            throw "nmake build failed with exit $LASTEXITCODE"
          }

      - name: Smoke test (racket runs on arm64; TLS via win32-ssl)
        shell: pwsh
        run: |
          $racketExe = Get-ChildItem $env:SRC_DIR -Recurse -Filter Racket.exe | Sort-Object FullName | Select-Object -First 1
          if (!$racketExe) {
            Write-Host "Racket.exe not found; source tree:"
            Get-ChildItem $env:SRC_DIR -Force | Select-Object -First 120 FullName
            throw "Racket.exe not found after build"
          }
          Write-Host "Using: $($racketExe.FullName)"
          # HARD: Racket runs and reports the right version.
          & $racketExe.FullName -e '(displayln (version))' | Tee-Object -Variable versionOut
          if ($versionOut -notmatch [regex]::Escape($env:SOURCE_VERSION)) { throw "version mismatch: $versionOut" }
          # HARD: Racket actually evaluates a program.
          & $racketExe.FullName -e '(require file/sha1) (displayln (sha1 (open-input-bytes #"abc")))' | Tee-Object -Variable shaOut
          if ($shaOut -notmatch 'a9993e364706816aba3e25717850c26c9cd0d89d') { throw "sha1 mismatch: $shaOut" }
          # INFO ONLY: rktcrypto is intentionally excluded on Windows (needs
          # __int128 / non-MSVC features), so ssl-available? is expected #f on
          # EVERY Windows arch and the openssl collection's TLS is unavailable.
          # This is the standing Windows crypto gap (not arm64-specific) that the
          # "reintroduce OpenSSL on Windows" work (poc-openssl-winarm64) targets.
          # Report it; do NOT fail the arm64 build PoC on it.
          & $racketExe.FullName -e '(require openssl) (printf "ssl-available? = ~a (expected #f on Windows)\n" (ssl-available?))' | Tee-Object -Variable sslOut
          & $racketExe.FullName -e '(displayln "poc-win-arm64-ok")' | Tee-Object -Variable okOut
          if ($okOut -notmatch 'poc-win-arm64-ok') { throw "final smoke failed: $okOut" }
          Write-Host "PoC OK: Racket $env:SOURCE_VERSION builds and runs on Windows arm64 (tarm64nt). Crypto/TLS is the standing Windows gap, addressed separately."
