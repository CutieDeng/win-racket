# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal: validate the cached portable ZIP design before wiring it into
# windows-ci-build-job. Unlike the cached installer (system cache keyed to
# the default install path), the portable zip must work at ANY extraction
# path, so it uses the classic IN-TREE compiled/ model: zo next to sources,
# location-independent. Questions:
#   1. Does raco setup (no --system, pristine config, roots = in-tree)
#      compile the whole tree in-tree, and does a second pass converge it?
#   2. Does the compiled tree survive re-zip + extraction at a DIFFERENT
#      path: setup no-op, smokes pass, startup fast?
#   3. Startup delta vs the shipped zo-less zip, for the release notes.

name: poc cached zip

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-cached-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_BASE: 'https://github.com/CutieDeng/win-racket/releases/download/v9.3.4'
  FORMULA_VERSION: '9.3.4.1'

jobs:
  poc-zip:
    name: zip ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Download released zip and extract at path A
        shell: bash
        run: |
          set -euxo pipefail
          TAR=/c/Windows/System32/tar.exe
          curl -fsSL "$RELEASE_BASE/racket9-$FORMULA_VERSION-windows-${{ matrix.arch }}.zip" -o portable.zip
          mkdir -p /c/work-a
          "$TAR" -xf portable.zip -C /c/work-a
          test -f "/c/work-a/racket9/Racket.exe"

      - name: Baseline startup (zo-less tree)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $racketExe = 'C:\work-a\racket9\Racket.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $racketExe -l racket/base -e '(void)'
          $sw.Stop()
          Write-Host ("BASELINE-STARTUP seconds={0:N1}" -f $sw.Elapsed.TotalSeconds)

      - name: Compile in-tree (two passes, timed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $racketExe = 'C:\work-a\racket9\Racket.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) { throw "first in-tree setup failed: $LASTEXITCODE" }
          $sw.Stop()
          $sw2 = [Diagnostics.Stopwatch]::StartNew()
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) { throw "second in-tree setup failed: $LASTEXITCODE" }
          $sw2.Stop()
          $zos = (Get-ChildItem -LiteralPath 'C:\work-a\racket9' -Recurse -Filter *.zo | Measure-Object).Count
          $mb = (Get-ChildItem -LiteralPath 'C:\work-a\racket9' -Recurse -Include *.zo,*.dep | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("INTREE-BUILD seconds={0:N0}+{1:N0} zos={2} mb={3:N1}" -f $sw.Elapsed.TotalSeconds, $sw2.Elapsed.TotalSeconds, $zos, $mb)
          if ($zos -lt 500) { throw "suspiciously few in-tree zos: $zos" }

      - name: Re-zip, extract at DIFFERENT path B
        shell: bash
        run: |
          set -euxo pipefail
          TAR=/c/Windows/System32/tar.exe
          cd /c/work-a
          "$TAR" -a -cf "$GITHUB_WORKSPACE/cached-zip.zip" racket9
          ls -l "$GITHUB_WORKSPACE/cached-zip.zip" "$GITHUB_WORKSPACE/portable.zip"
          mkdir -p "/c/some other/nested dir"
          "$TAR" -xf "$GITHUB_WORKSPACE/cached-zip.zip" -C "/c/some other/nested dir"
          test -f "/c/some other/nested dir/racket9/Racket.exe"

      - name: Validate at path B (HARD; no-op setup, fast startup, smokes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\some other\nested dir\racket9'
          $racketExe = Join-Path $root 'Racket.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $racketExe -l racket/base -e '(void)'
          $sw.Stop()
          Write-Host ("CACHED-STARTUP seconds={0:N1}" -f $sw.Elapsed.TotalSeconds)
          & $racketExe -e '(displayln (version))' | Tee-Object -Variable v
          if ($v -notmatch '9\.3\.4') { throw "unexpected version: $v" }
          & $racketExe -e '(require racket/random/generator) (unless rktrandom-available? (error (quote poc) 1)) (require openssl) (unless ssl-available? (error (quote poc) 2)) (displayln (quote zip-smoke-ok))' | Tee-Object -Variable s
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
          if (($s -join "`n") -notmatch 'zip-smoke-ok') { throw 'smoke marker missing' }
          Start-Sleep -Seconds 2
          $marker = Get-Date
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) { throw "revalidation setup failed" }
          $rebuilt = @(Get-ChildItem -LiteralPath $root -Recurse -Include *.zo,*.dep | Where-Object { $_.LastWriteTime -gt $marker })
          Write-Host ("REVALIDATE rebuilt={0}" -f $rebuilt.Count)
          if ($rebuilt.Count -gt 0) {
            $rebuilt | Select-Object -First 10 FullName | Format-Table -AutoSize
            throw "in-tree compiled zip did not validate at a different path: $($rebuilt.Count) rewrites"
          }
          Write-Host "PoC OK: in-tree cached zip is relocatable and converged on ${{ matrix.arch }}."
