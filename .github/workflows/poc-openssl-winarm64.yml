# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal (P1 of "reintroduce OpenSSL toolchain on Windows"): verify that OpenSSL 3
# can be cross-compiled to Windows libssl/libcrypto DLLs for BOTH x86_64 and
# arm64, using llvm-mingw + the fork's `mingw-arm64` Configure target. This only
# checks the build toolchain; it does not wire OpenSSL into the Racket runtime.

name: poc openssl win crosscompile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-openssl-winarm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossbuild-openssl:
    name: openssl ${{ matrix.arch }} (win)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            ossl_target: mingw64
            cross_prefix: x86_64-w64-mingw32-
          - arch: arm64
            ossl_target: mingw-arm64
            cross_prefix: aarch64-w64-mingw32-
    env:
      OPENSSL_VERSION: '3.0.2'
    steps:
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl make xz-utils curl ca-certificates

      - name: Install llvm-mingw (provides aarch64-w64-mingw32 clang toolchain)
        run: |
          set -euxo pipefail
          # Resolve the latest llvm-mingw ucrt ubuntu x86_64 release asset.
          api="https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
                | grep -oE '"browser_download_url": *"[^"]*ucrt-ubuntu[^"]*x86_64\.tar\.xz"' \
                | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          echo "llvm-mingw asset: $url"
          test -n "$url"
          curl -fsSL "$url" -o llvm-mingw.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Verify cross toolchain present
        run: |
          set -euxo pipefail
          "${{ matrix.cross_prefix }}clang" --version
          "${{ matrix.cross_prefix }}windres" --version || true

      - name: Download OpenSSL source
        run: |
          set -euxo pipefail
          curl -fsSL "https://www.openssl.org/source/old/3.0/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz \
            || curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xzf openssl.tar.gz
          echo "OSSL_DIR=$PWD/openssl-${OPENSSL_VERSION}" >> "$GITHUB_ENV"

      - name: Add mingw-arm64 Configure target (fork patch)
        if: matrix.arch == 'arm64'
        run: |
          set -euxo pipefail
          conf="$OSSL_DIR/Configurations/10-main.conf"
          grep -q '"mingw-arm64"' "$conf" && { echo "already present"; exit 0; } || true
          # Insert the mingw-arm64 target right after the mingw64 target's closing "},".
          perl -0777 -i -pe 's/("mingw64"\s*=>\s*\{.*?\n\s*\},\n)/$1    "mingw-arm64" => {\n        inherit_from     => [ "mingw-common" ],\n        cc               => "clang",\n        bn_ops           => add("RC4_CHAR"),\n        asm_arch         => "aarch64",\n        perlasm_scheme   => "linux64",\n        multilib         => "64",\n    },\n/s' "$conf"
          grep -q '"mingw-arm64"' "$conf" || { echo "failed to insert mingw-arm64 target"; exit 1; }
          echo "Inserted mingw-arm64 target."

      - name: Configure + build OpenSSL DLLs (${{ matrix.arch }})
        run: |
          set -euxo pipefail
          cd "$OSSL_DIR"
          # RCFLAGS default is --target=pe-x86-64 which is wrong for arm64; clear it.
          export RCFLAGS=""
          # OpenSSL 3.0.2 Configure does not accept no-docs/no-apps; keep it minimal.
          ./Configure ${{ matrix.ossl_target }} \
            --cross-compile-prefix=${{ matrix.cross_prefix }} \
            shared no-tests \
            RCFLAGS=""
          make -j"$(nproc)" build_libs
          echo "=== produced DLLs ==="
          ls -la libssl-3.dll libcrypto-3.dll

      - name: Verify DLL architecture
        run: |
          set -euxo pipefail
          cd "$OSSL_DIR"
          for dll in libcrypto-3.dll libssl-3.dll; do
            test -f "$dll" || { echo "missing $dll"; exit 1; }
            info=$("$HOME/llvm-mingw/bin/llvm-readobj" --file-headers "$dll" 2>/dev/null | grep -iE "Machine|Format" || true)
            echo "$dll: $info"
          done
          # arm64 PE machine is ARM64 (0xAA64); x86_64 is AMD64 (0x8664)
          machine=$("$HOME/llvm-mingw/bin/llvm-readobj" --file-headers libcrypto-3.dll | grep -i "Machine" | head -1)
          echo "libcrypto-3.dll machine: $machine"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "$machine" | grep -iqE "ARM64|AA64" || { echo "libcrypto-3.dll is not ARM64"; exit 1; }
          else
            echo "$machine" | grep -iqE "AMD64|8664|x86-64" || { echo "libcrypto-3.dll is not x86_64"; exit 1; }
          fi
          echo "PoC OK: OpenSSL 3 built libssl/libcrypto DLLs for Windows ${{ matrix.arch }}."

      - name: Upload DLLs
        uses: actions/upload-artifact@v6
        with:
          name: 'openssl-win-${{ matrix.arch }}'
          path: |
            ${{ env.OSSL_DIR }}/libssl-3.dll
            ${{ env.OSSL_DIR }}/libcrypto-3.dll
          if-no-files-found: error
