# PoC (experimental, hand-authored — NOT generated by package-racket).
# End-to-end test of the PUBLISHED 9.3.4 Windows installers — the artifacts
# real users download. Answers concretely:
#   1. Does -setup-cached.exe actually ship the full system compiled cache
#      (~1985 files / ~87 MB on disk), and does a default install skip the
#      raco setup entirely (install time in seconds, not minutes)?
#   2. Does the shipped cache validate in place (raco setup no-op) after a
#      REAL Inno file copy (not the tar simulation used by earlier PoCs)?
#   3. Does the plain -setup.exe post-install raco setup now work end to end
#      (the config-rewrite corruption and the PS 5.1 quoting bug both lived
#      on this never-CI-tested path)?
#   4. Does the uninstaller remove the marker-guarded cache?

name: poc installer e2e

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-installer-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_BASE: 'https://github.com/CutieDeng/win-racket/releases/download/v9.3.4'
  FORMULA_VERSION: '9.3.4.1'
  INSTALL_ROOT: 'C:\Program Files\Racket9'
  CACHE_ROOT: 'C:\Program Files\Racket9\var\cache\racket\compiled'

jobs:
  e2e:
    name: e2e ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Download published installers
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "$RELEASE_BASE/racket9-$FORMULA_VERSION-windows-${{ matrix.arch }}-setup-cached.exe" -o setup-cached.exe
          curl -fsSL "$RELEASE_BASE/racket9-$FORMULA_VERSION-windows-${{ matrix.arch }}-setup.exe" -o setup-plain.exe
          ls -l setup-cached.exe setup-plain.exe

      - name: Install cached (HARD; must be fast and ship the cache)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath (Resolve-Path 'setup-cached.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=cached-install.log' -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) {
            if (Test-Path 'cached-install.log') { Get-Content 'cached-install.log' | Select-Object -Last 40 }
            throw "cached installer exited $($p.ExitCode)"
          }
          Write-Host ("CACHED-INSTALL seconds={0:N0}" -f $sw.Elapsed.TotalSeconds)
          $count = (Get-ChildItem -LiteralPath $env:CACHE_ROOT -Recurse -File | Measure-Object).Count
          $mb = (Get-ChildItem -LiteralPath $env:CACHE_ROOT -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("CACHED-PAYLOAD files={0} mb={1:N1}" -f $count, $mb)
          if ($count -lt 1900) { throw "shipped cache incomplete: $count files" }
          if ($mb -lt 60) { throw "shipped cache suspiciously small: $mb MB" }
          # a cached default install must not have run raco setup (minutes)
          if ($sw.Elapsed.TotalSeconds -gt 120) { throw "cached install took too long; raco setup likely ran" }

      - name: Runtime + convergence smoke on real install (HARD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $racketExe = Join-Path $env:INSTALL_ROOT 'Racket.exe'
          & $racketExe -e '(displayln (version))' | Tee-Object -Variable v
          if ($v -notmatch '9\.3\.4') { throw "unexpected version: $v" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $racketExe -l racket/base -e '(void)'
          $sw.Stop()
          Write-Host ("STARTUP racket/base seconds={0:N1}" -f $sw.Elapsed.TotalSeconds)
          & $racketExe -e '(require racket/random/generator) (unless rktrandom-available? (error (quote poc) 1)) (require openssl) (unless ssl-available? (error (quote poc) 2)) (displayln (quote e2e-smoke-ok))' | Tee-Object -Variable s
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
          if (($s -join "`n") -notmatch 'e2e-smoke-ok') { throw 'smoke marker missing' }
          Start-Sleep -Seconds 2
          $marker = Get-Date
          & $racketExe -N raco -l- raco setup --system --no-user -D --no-pkg-deps
          if ($LASTEXITCODE -ne 0) { throw "revalidation setup failed" }
          $rebuilt = @(Get-ChildItem -LiteralPath $env:CACHE_ROOT -Recurse -File | Where-Object { $_.LastWriteTime -gt $marker })
          Write-Host ("REVALIDATE rebuilt={0}" -f $rebuilt.Count)
          if ($rebuilt.Count -gt 0) {
            $rebuilt | Select-Object -First 10 FullName | Format-Table -AutoSize
            throw "shipped cache did not validate after a real Inno install: $($rebuilt.Count) rewrites"
          }

      - name: Uninstall cached (HARD; cache dir must go away)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unins = Get-ChildItem -LiteralPath $env:INSTALL_ROOT -Filter 'unins*.exe' | Select-Object -First 1
          if (!$unins) { throw "uninstaller not found" }
          $p = Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $env:CACHE_ROOT) { throw "cache dir survived uninstall" }
          if (Test-Path -LiteralPath (Join-Path $env:INSTALL_ROOT 'Racket.exe')) { throw "Racket.exe survived uninstall" }

      - name: Install plain (HARD; post-install raco setup must work)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath (Resolve-Path 'setup-plain.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=plain-install.log' -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) {
            if (Test-Path 'plain-install.log') { Get-Content 'plain-install.log' | Select-Object -Last 40 }
            throw "plain installer exited $($p.ExitCode)"
          }
          Write-Host ("PLAIN-INSTALL seconds={0:N0}" -f $sw.Elapsed.TotalSeconds)
          $count = (Get-ChildItem -LiteralPath $env:CACHE_ROOT -Recurse -File | Measure-Object).Count
          Write-Host ("PLAIN-CACHE files={0}" -f $count)
          if ($count -lt 1900) { throw "post-install raco setup did not populate the cache: $count files" }
          $racketExe = Join-Path $env:INSTALL_ROOT 'Racket.exe'
          & $racketExe -e '(displayln (version))' | Tee-Object -Variable v
          if ($v -notmatch '9\.3\.4') { throw "unexpected version: $v" }
          Write-Host "PoC OK: both published 9.3.4 installers verified end to end on ${{ matrix.arch }}."
# retrigger: verify republished 9.3.4 installers (app-constant fix)
