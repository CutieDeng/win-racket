# GENERATED WINDOWS PORTABLE PACKAGING METADATA - DO NOT EDIT.
# Source of truth: https://github.com/CutieDeng/package-racket
# Humans and LLM agents must change package-racket and regenerate; manual workflow edits are not production-safe.

name: windows portable build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x86_64:
    name: build windows x86_64
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      PACKAGE_NAME: 'racket9'
      SOURCE_VERSION: '9.3.5'
      FORMULA_VERSION: '9.3.5.1'
      SOURCE_URL: 'https://github.com/CutieDeng/racket/releases/download/v9.3.5/racket-minimal-9.3.5-src.tgz'
      SOURCE_SHA256: 'dac88d1a7f1c104de93b31f385bdebe21c43cfbd9f3ca03c0d68050fae6e6663'
      ZIP_NAME: 'racket9-9.3.5.1-windows-x86_64.zip'
      CACHED_ZIP_NAME: 'racket9-9.3.5.1-windows-x86_64-cached.zip'
      EXE_NAME: 'racket9-9.3.5.1-windows-x86_64-setup.exe'
      CACHED_EXE_NAME: 'racket9-9.3.5.1-windows-x86_64-setup-cached.exe'
      PORTABLE_DIR: 'racket9'
      BUILD_JOBS: '2'
      MSVC_ARCH: 'x64'
      NMAKE_TARGET: 'plain-install'
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@v6

      - name: Locate Visual Studio build tools
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsall)) {
            throw "vcvarsall.bat not found: $vcvarsall"
          }
          "VCVARSALL_BAT=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify source archive
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source | Out-Null
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source.tgz
          $actual = (Get-FileHash source.tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) {
            throw "Source sha256 mismatch: expected $env:SOURCE_SHA256 got $actual"
          }
          tar -xzf source.tgz -C source
          $entries = @(Get-ChildItem source -Directory)
          if ($entries.Count -ne 1) {
            Get-ChildItem source | Format-Table -AutoSize
            throw "source archive must contain exactly one top-level directory"
          }
          "SRC_DIR=$($entries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Racket with nmake
        shell: pwsh
        run: |
          $buildScript = @"
          @echo on
          call "%VCVARSALL_BAT%" %MSVC_ARCH%
          cd /d "%SRC_DIR%"
          if exist Makefile (
            echo Reusing existing top-level Makefile in %CD%
          ) else if exist src\winfig.bat (
            dir src\winfig.bat
            dir src\Makefile.nt
            dir src\buildmain.zuo
            call src\winfig.bat
            if not exist Makefile (
              echo winfig.bat did not create Makefile in %CD%
              dir
              exit /b 1
            )
          ) else (
            dir
            echo Neither top-level Makefile nor src\winfig.bat exists in %SRC_DIR%
            exit /b 1
          )
          for %%D in (bin lib share include etc) do (
            if exist "%%D" (
              if not exist "%%D\" (
                echo Expected install layout directory but found non-directory: %%D
                exit /b 1
              )
            ) else (
              mkdir "%%D"
            )
          )
          dir lib
          call :RunNmake all
          if errorlevel 1 exit /b %errorlevel%
          if /I "%NMAKE_TARGET%"=="all" goto after_nmake
          call :RunNmake %NMAKE_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          goto after_nmake
          :RunNmake
          echo Running nmake target %*
          nmake /f Makefile %* JOBS=%BUILD_JOBS%
          exit /b %errorlevel%
          :after_nmake
          "@
          Set-Content -Path build-racket.cmd -Value $buildScript -Encoding ASCII
          cmd.exe /c build-racket.cmd
          if ($LASTEXITCODE -ne 0) {
            if ($env:SRC_DIR) {
              Write-Host "Source root after failed nmake:"
              Get-ChildItem $env:SRC_DIR -Force | Select-Object -First 80 Mode, Length, FullName
              foreach ($relative in @("bin", "lib", "share", "include", "etc", "cs\c", "cs\c\lib")) {
                $candidate = Join-Path $env:SRC_DIR $relative
                if (Test-Path $candidate) {
                  Write-Host "Directory snapshot: $candidate"
                  Get-ChildItem $candidate -Force | Select-Object -First 80 Mode, Length, FullName
                } else {
                  Write-Host "Missing directory snapshot target: $candidate"
                }
              }
              Write-Host "Known Racket CS DLL files after failed nmake:"
              Get-ChildItem $env:SRC_DIR -Recurse -Filter libracketcs*.dll -ErrorAction SilentlyContinue |
                Select-Object -First 80 Mode, Length, FullName
            }
            throw "nmake build failed with exit $LASTEXITCODE"
          }

      - name: Install llvm-mingw (clang for librktcrypto DLL)
        shell: bash
        run: |
          set -euxo pipefail
          api="https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
                | grep -oE '"browser_download_url": *"[^"]*ucrt-x86_64\.zip"' \
                | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          echo "llvm-mingw asset: $url"
          test -n "$url"
          curl -fsSL "$url" -o llvm-mingw.zip
          mkdir -p "$HOME/llvm-mingw"
          unzip -q llvm-mingw.zip -d "$HOME/llvm-mingw"
          bindir=$(dirname "$(find "$HOME/llvm-mingw" -name clang.exe | head -1)")
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/x86_64-w64-mingw32-clang" --version

      - name: Build librktcrypto.dll with clang
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          crypto=$(dirname "$(find "$src/src" -name rktcrypto_ecc.c | head -1)")
          echo "librktcrypto sources: $crypto"
          test -n "$crypto"
          mkdir -p dllbuild
          grep -o '"rktcrypto[^"]*\.[cS]"' "$crypto/build.zuo" | tr -d '"' > dllbuild/sources.txt
          n=$(wc -l < dllbuild/sources.txt)
          echo "librktcrypto source count: $n"
          test "$n" -ge 70
          cc=x86_64-w64-mingw32-clang
          cat dllbuild/sources.txt | xargs -P 4 -I@SRC@ sh -c "$cc -c -O3 -I'$crypto' -o 'dllbuild/@SRC@.o' '$crypto/@SRC@'"
          $cc -shared -o dllbuild/librktcrypto.dll dllbuild/*.o "$crypto/rktcrypto.def" -lbcrypt
          cp dllbuild/librktcrypto.dll "$src/"
          ls -l "$src/librktcrypto.dll"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = Get-ChildItem $programFilesX86 -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$iscc -or !(Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble portable zip
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force portable, artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force portable, artifacts | Out-Null
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          foreach ($name in @("collects", "etc", "lib", "share", "include", "doc")) {
            $source = Join-Path $env:SRC_DIR $name
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $portableRoot $name) -Recurse -Force
            } else {
              Write-Host "Skipping absent optional runtime directory: $source"
            }
          }
          Get-ChildItem -LiteralPath $env:SRC_DIR -File |
            Where-Object { $_.Name -match '\.(exe|dll|def)$' -or $_.Name -eq "README" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $portableRoot -Force }
          foreach ($required in @("collects", "etc", "lib", "share")) {
            $requiredPath = Join-Path $portableRoot $required
            if (!(Test-Path $requiredPath)) {
              Get-ChildItem -LiteralPath $env:SRC_DIR -Force | Select-Object -First 120 Mode, Length, FullName
              throw "required portable runtime path missing: $requiredPath"
            }
          }
          $racketExe = Get-ChildItem $portableRoot -Recurse -Filter Racket.exe | Sort-Object FullName | Select-Object -First 1
          $racoExe = Get-ChildItem $portableRoot -Recurse -Filter raco.exe | Sort-Object FullName | Select-Object -First 1
          if (!$racketExe) {
            Write-Host "Source root files:"
            Get-ChildItem -LiteralPath $env:SRC_DIR -Force | Select-Object -First 120 Mode, Length, FullName
            Write-Host "Portable files:"
            Get-ChildItem $portableRoot -Recurse -File | Select-Object -First 120 FullName
            throw "racket.exe not found in portable tree"
          }
          if ($racoExe) {
            $racoCommand = $racoExe.FullName
            $racoArgs = @("pkg", "show", "--all")
          } else {
            $racoCmd = Join-Path $racketExe.DirectoryName "raco.cmd"
            @(
              "@echo off",
              "`"%~dp0$($racketExe.Name)`" -N raco -l- raco %*"
            ) | Set-Content -Path $racoCmd -Encoding ASCII
            $racoCommand = $racketExe.FullName
            $racoArgs = @("-N", "raco", "-l-", "raco", "pkg", "show", "--all")
          }
          & $racketExe.FullName -e '(displayln (version))' | Tee-Object -Variable versionOut
          if ($versionOut -notmatch [regex]::Escape($env:SOURCE_VERSION)) {
            throw "Racket version output does not include $env:SOURCE_VERSION: $versionOut"
          }
          & $racketExe.FullName -e '(displayln "windows-portable-ok")'
          if ($LASTEXITCODE -ne 0) {
            throw "Racket smoke check failed with exit $LASTEXITCODE"
          }
          & $racketExe.FullName -e '(require openssl racket/port) (unless ssl-available? (error (quote tls) "ssl-available? is #f: librktcrypto.dll missing next to Racket.exe")) (define-values (i o) (ssl-connect "example.com" 443 (quote secure))) (write-string "GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n" o) (flush-output o) (define s (read-line i)) (close-input-port i) (close-output-port o) (unless (regexp-match? #rx"200" s) (error (quote tls) s)) (displayln "windows-tls-ok")' | Tee-Object -Variable tlsOut
          if ($LASTEXITCODE -ne 0) {
            throw "Windows TLS smoke failed with exit $LASTEXITCODE"
          }
          if (($tlsOut -join "`n") -notmatch 'windows-tls-ok') {
            throw "Windows TLS smoke did not print windows-tls-ok"
          }
          & $racketExe.FullName -e '(require racket/random/generator) (unless rktrandom-available? (error (quote rktrandom) "rktrandom-available? is #f: librktrandom not linked into Racket.exe")) (define g (make-rgen 42)) (define xs (for/list ([i (in-range 4)]) (rgen-u64 g))) (unless (equal? xs (list 17334047174172577666 1019500725184315962 11076454993390921235 13198794054228246118)) (error (quote rktrandom) "seed-42 xoshiro256++ stream diverges from the Unix reference" xs)) (displayln "windows-rktrandom-ok")' | Tee-Object -Variable rndOut
          if ($LASTEXITCODE -ne 0) {
            throw "Windows rktrandom smoke failed with exit $LASTEXITCODE"
          }
          if (($rndOut -join "`n") -notmatch 'windows-rktrandom-ok') {
            throw "Windows rktrandom smoke did not print windows-rktrandom-ok"
          }
          & $racoCommand @racoArgs | Select-Object -First 40
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "raco package listing failed with exit $LASTEXITCODE; keeping portable artifact because Racket smoke check passed"
            $global:LASTEXITCODE = 0
          }
          @(
            "Racket portable build",
            "Source: $env:SOURCE_URL",
            "Version: $env:SOURCE_VERSION",
            "Package version: $env:FORMULA_VERSION",
            "Find Racket.exe inside this directory. If raco.exe is absent, use raco.cmd next to Racket.exe."
          ) | Set-Content -Path (Join-Path $portableRoot "README-portable.txt") -Encoding UTF8
          $artifactPath = Join-Path "artifacts" $env:ZIP_NAME
          Compress-Archive -Path $portableRoot -DestinationPath $artifactPath -Force
          if ((Get-Item $artifactPath).Length -le 0) {
            throw "portable zip is empty: $artifactPath"
          }
          Get-FileHash $artifactPath -Algorithm SHA256

      - name: Build cached portable zip (in-tree compiled)
        shell: pwsh
        run: |
          # A portable zip must work at ANY extraction path, so unlike the
          # cached installer's path-keyed system cache this variant uses the
          # classic in-tree compiled/ model: zo next to sources, config left
          # pristine, location-independent. Two setup passes: the first
          # bootstraps from source on the zo-less tree and does not
          # self-validate; the second converges the deps.
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          New-Item -ItemType Directory -Force "portable-zipcached" | Out-Null
          $zipRoot = Join-Path "portable-zipcached" $env:PORTABLE_DIR
          Copy-Item -LiteralPath $portableRoot -Destination $zipRoot -Recurse
          $racketExe = Join-Path $zipRoot 'Racket.exe'
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) {
            throw "in-tree setup pass 1 failed with exit $LASTEXITCODE"
          }
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) {
            throw "in-tree setup pass 2 failed with exit $LASTEXITCODE"
          }
          $zos = (Get-ChildItem -LiteralPath $zipRoot -Recurse -Filter *.zo | Measure-Object).Count
          if ($zos -lt 500) {
            throw "suspiciously few in-tree zos: $zos"
          }
          Write-Host "cached zip payload: $zos in-tree zos"
          $cachedZipPath = Join-Path "artifacts" $env:CACHED_ZIP_NAME
          Compress-Archive -Path $zipRoot -DestinationPath $cachedZipPath -Force
          if ((Get-Item $cachedZipPath).Length -le 0) {
            throw "cached portable zip is empty: $cachedZipPath"
          }
          Get-FileHash $cachedZipPath -Algorithm SHA256

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          if (!(Test-Path $portableRoot)) {
            throw "portable tree missing: $portableRoot"
          }
          @'
          param(
            [Parameter(Mandatory=$true)] [string] $InstallRoot,
            [Parameter(Mandatory=$true)] [string] $CacheRoot
          )

          $ErrorActionPreference = 'Stop'

          function Test-DirectoryEmpty([string] $Path) {
            if (!(Test-Path -LiteralPath $Path)) { return $true }
            return -not (Get-ChildItem -LiteralPath $Path -Force -ErrorAction Stop | Select-Object -First 1)
          }

          $CacheRoot = [IO.Path]::GetFullPath($CacheRoot)
          $root = [IO.Path]::GetPathRoot($CacheRoot).TrimEnd('\')
          if ([string]::IsNullOrWhiteSpace($CacheRoot) -or ($CacheRoot.TrimEnd('\') -eq $root)) {
            throw "Refusing unsafe cache path: $CacheRoot"
          }

          $marker = Join-Path $CacheRoot '.racket-installer-cache'
          if ((Test-Path -LiteralPath $CacheRoot) -and
              !(Test-Path -LiteralPath $marker) -and
              !(Test-DirectoryEmpty $CacheRoot)) {
            throw "Cache path exists and is not empty or installer-owned: $CacheRoot"
          }

          New-Item -ItemType Directory -Force $CacheRoot | Out-Null
          Set-Content -LiteralPath $marker -Value 'Racket installer owned cache directory' -Encoding ASCII

          $configPath = Join-Path $InstallRoot 'etc\config.rktd'
          if (!(Test-Path -LiteralPath $configPath)) {
            throw "Racket config not found: $configPath"
          }
          $configText = Get-Content -LiteralPath $configPath -Raw
          foreach ($key in @('default-scope', 'compiled-file-cache-roots', 'compiled-file-system-cache-root')) {
            $pattern = '\s*\(' + [regex]::Escape($key) + '\s+\.\s+("[^"]*"|\([^)]*\)|[^)]*)\)'
            $configText = [regex]::Replace($configText, $pattern, '')
          }
          $configText = $configText.Replace('"../../share/racket/self-catalog"', '"../share/self-catalog"')
          $cacheForConfig = $CacheRoot.Replace('\', '/').Replace('"', '\"')
          $entries = ' (default-scope . "installation") (compiled-file-cache-roots . (user system)) (compiled-file-system-cache-root . "' + $cacheForConfig + '")'
          # The final "))" is <last-entry-close><hash-close>: re-close the
          # last entry BEFORE splicing the new entries, then close the hash.
          $configText = [regex]::Replace($configText, '\s*\)\)\s*$', ')' + $entries + ")`r`n")
          if ($configText -notmatch '\(compiled-file-system-cache-root \.' ) {
            throw 'Unable to configure Racket system cache root'
          }
          Set-Content -LiteralPath $configPath -Value $configText -Encoding UTF8

          $racoExe = Join-Path $InstallRoot 'raco.exe'
          $racketExe = Join-Path $InstallRoot 'Racket.exe'
          if (Test-Path -LiteralPath $racketExe) {
            # No double quotes in the -e argument: this script runs under
            # Windows PowerShell 5.1 (Inno launches powershell.exe), whose
            # native argument passing mangles embedded quotes.
            $env:RACKET_INSTALLER_CONFIG_CHECK = $configPath
            & $racketExe -e '(void (call-with-input-file (getenv (symbol->string (quote RACKET_INSTALLER_CONFIG_CHECK))) read))'
            if ($LASTEXITCODE -ne 0) {
              throw "rewritten config.rktd is not readable Racket data: $configPath"
            }
          }
          if (Test-Path -LiteralPath $racoExe) {
            & $racoExe setup --system --no-user --reset-cache -D --no-pkg-deps
          } elseif (Test-Path -LiteralPath $racketExe) {
            & $racketExe -N raco -l- raco setup --system --no-user --reset-cache -D --no-pkg-deps
          } else {
            throw "Neither raco.exe nor Racket.exe exists in $InstallRoot"
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          '@ | Set-Content -Path (Join-Path $portableRoot "installer-configure.ps1") -Encoding UTF8

          $outputBase = [IO.Path]::GetFileNameWithoutExtension($env:EXE_NAME)
          @"
          [Setup]
          AppId=racket9
          AppName=Racket
          AppVersion=$env:FORMULA_VERSION
          DefaultDirName={autopf}\Racket9
          DefaultGroupName=Racket 9
          DisableProgramGroupPage=yes
          OutputDir=artifacts
          OutputBaseFilename=$outputBase
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          WizardStyle=modern

          [Files]
          Source: "portable\$env:PORTABLE_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Racket"; Filename: "{app}\Racket.exe"
          Name: "{group}\Uninstall Racket"; Filename: "{uninstallexe}"

          [Code]
          var
            CachePage: TInputDirWizardPage;
            CacheDefaultRoot: String;

          function DefaultCacheRoot(): String;
          begin
            Result := ExpandConstant('{app}\var\cache\racket\compiled');
          end;

          function GetCacheRoot(Param: String): String;
          var
            Value: String;
          begin
            Value := ExpandConstant('{param:CACHEPATH|}');
            if Value <> '' then
              Result := Value
            else if Assigned(CachePage) and (Trim(CachePage.Values[0]) <> '') then
              Result := CachePage.Values[0]
            else
              Result := DefaultCacheRoot();
          end;

          procedure InitializeWizard;
          begin
            CachePage := CreateInputDirPage(wpSelectDir, 'Racket Cache Directory',
              'Choose the compiled cache directory.',
              'Racket builds the system cache during installation. For unattended installs, pass /CACHEPATH=...',
              False, '');
            CachePage.Add('');
            // {app} is not initialized yet; CurPageChanged fills in the
            // default when the page is entered (silent installs never enter
            // it and fall back inside GetCacheRoot at ssPostInstall).
            CacheDefaultRoot := '';
            CachePage.Values[0] := '';
          end;

          procedure CurPageChanged(CurPageID: Integer);
          begin
            if Assigned(CachePage) and (CurPageID = CachePage.ID) then
              if (CachePage.Values[0] = '') or (CachePage.Values[0] = CacheDefaultRoot) then begin
                CacheDefaultRoot := DefaultCacheRoot();
                CachePage.Values[0] := CacheDefaultRoot;
              end;
          end;

          function NextButtonClick(CurPageID: Integer): Boolean;
          begin
            Result := True;
            if Assigned(CachePage) and (CurPageID = CachePage.ID) and (Trim(CachePage.Values[0]) = '') then begin
              MsgBox('Cache path is required.', mbError, MB_OK);
              Result := False;
            end;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
            Params: String;
          begin
            if CurStep = ssPostInstall then begin
              if not RegWriteStringValue(HKLM, 'Software\Racket9', 'CacheRoot', GetCacheRoot('')) then
                RaiseException('Failed to save Racket cache path.');
              Params := '-NoProfile -ExecutionPolicy Bypass -File "' + ExpandConstant('{app}\installer-configure.ps1') +
                '" -InstallRoot "' + ExpandConstant('{app}') + '" -CacheRoot "' + GetCacheRoot('') + '"';
              if not Exec('powershell.exe', Params, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
                RaiseException('Failed to run Racket cache setup.');
              if ResultCode <> 0 then
                RaiseException('Racket cache setup failed with exit code ' + IntToStr(ResultCode) + '.');
            end;
          end;

          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          var
            CacheRoot: String;
          begin
            if CurUninstallStep = usUninstall then begin
              if RegQueryStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then begin
                if FileExists(AddBackslash(CacheRoot) + '.racket-installer-cache') then
                  DelTree(CacheRoot, True, True, True);
              end;
              RegDeleteKeyIncludingSubkeys(HKLM, 'Software\Racket9');
            end;
          end;
          "@ | Set-Content -Path racket-installer.iss -Encoding UTF8

          & $env:ISCC_EXE racket-installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit $LASTEXITCODE"
          }
          $installerPath = Join-Path "artifacts" $env:EXE_NAME
          if (!(Test-Path $installerPath) -or (Get-Item $installerPath).Length -le 0) {
            throw "installer exe missing or empty: $installerPath"
          }
          Get-FileHash $installerPath -Algorithm SHA256

      - name: Build cached installer (prebuilt system cache)
        shell: pwsh
        run: |
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          # The runtime-keyed system compiled cache is keyed by absolute
          # source path (setup/compiled-cache.rkt), so the shipped cache is
          # valid only for the default install location. Stage the payload
          # there, run the SAME configure script the plain installer runs on
          # the user's machine, and package the result.
          $installRoot = 'C:\Program Files\Racket9'
          if (Test-Path -LiteralPath $installRoot) {
            throw "unexpected existing install root: $installRoot"
          }
          Copy-Item -LiteralPath $portableRoot -Destination $installRoot -Recurse
          $cacheRoot = Join-Path $installRoot 'var\cache\racket\compiled'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installRoot 'installer-configure.ps1') -InstallRoot $installRoot -CacheRoot $cacheRoot
          if ($LASTEXITCODE -ne 0) {
            throw "CI system-cache raco setup failed with exit $LASTEXITCODE"
          }
          # The portable tree ships no in-tree .zo, so the first setup
          # bootstraps from source and its cache does not self-validate; a
          # second pass converges the deps so installed caches no-op under
          # any later raco setup.
          $racketExe = Join-Path $installRoot 'Racket.exe'
          & $racketExe -N raco -l- raco setup --system --no-user -D --no-pkg-deps
          if ($LASTEXITCODE -ne 0) {
            throw "CI system-cache converge setup failed with exit $LASTEXITCODE"
          }
          $count = (Get-ChildItem -LiteralPath $cacheRoot -Recurse -File | Measure-Object).Count
          if ($count -lt 100) {
            throw "suspiciously small system cache: $count files"
          }
          Write-Host "cached payload: $count system-cache files"
          New-Item -ItemType Directory -Force "portable-cached" | Out-Null
          $cachedRoot = Join-Path "portable-cached" $env:PORTABLE_DIR
          Copy-Item -LiteralPath $installRoot -Destination $cachedRoot -Recurse
          Remove-Item -Recurse -Force -LiteralPath $installRoot
          $outputBase = [IO.Path]::GetFileNameWithoutExtension($env:CACHED_EXE_NAME)
          @"
          [Setup]
          AppId=racket9
          AppName=Racket
          AppVersion=$env:FORMULA_VERSION
          DefaultDirName={autopf}\Racket9
          DefaultGroupName=Racket 9
          DisableProgramGroupPage=yes
          OutputDir=artifacts
          OutputBaseFilename=$outputBase
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          WizardStyle=modern

          [Files]
          Source: "portable-cached\$env:PORTABLE_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Racket"; Filename: "{app}\Racket.exe"
          Name: "{group}\Uninstall Racket"; Filename: "{uninstallexe}"

          [Code]
          var
            CachePage: TInputDirWizardPage;
            CacheDefaultRoot: String;

          function DefaultCacheRoot(): String;
          begin
            Result := ExpandConstant('{app}\var\cache\racket\compiled');
          end;

          function GetCacheRoot(Param: String): String;
          var
            Value: String;
          begin
            Value := ExpandConstant('{param:CACHEPATH|}');
            if Value <> '' then
              Result := Value
            else if Assigned(CachePage) and (Trim(CachePage.Values[0]) <> '') then
              Result := CachePage.Values[0]
            else
              Result := DefaultCacheRoot();
          end;

          procedure InitializeWizard;
          begin
            CachePage := CreateInputDirPage(wpSelectDir, 'Racket Cache Directory',
              'Choose the compiled cache directory.',
              'This installer ships a prebuilt cache for the default install directory; keeping the defaults skips the cache build. A custom directory rebuilds the cache during installation. For unattended installs, pass /CACHEPATH=...',
              False, '');
            CachePage.Add('');
            // {app} is not initialized yet; CurPageChanged fills in the
            // default when the page is entered (silent installs never enter
            // it and fall back inside GetCacheRoot at ssPostInstall).
            CacheDefaultRoot := '';
            CachePage.Values[0] := '';
          end;

          procedure CurPageChanged(CurPageID: Integer);
          begin
            if Assigned(CachePage) and (CurPageID = CachePage.ID) then
              if (CachePage.Values[0] = '') or (CachePage.Values[0] = CacheDefaultRoot) then begin
                CacheDefaultRoot := DefaultCacheRoot();
                CachePage.Values[0] := CacheDefaultRoot;
              end;
          end;

          function NextButtonClick(CurPageID: Integer): Boolean;
          begin
            Result := True;
            if Assigned(CachePage) and (CurPageID = CachePage.ID) and (Trim(CachePage.Values[0]) = '') then begin
              MsgBox('Cache path is required.', mbError, MB_OK);
              Result := False;
            end;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
            Params: String;
            CacheRoot: String;
          begin
            if CurStep = ssPostInstall then begin
              CacheRoot := GetCacheRoot('');
              if not RegWriteStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then
                RaiseException('Failed to save Racket cache path.');
              if (ExpandConstant('{app}') = ExpandConstant('{autopf}\Racket9'))
                 and (CacheRoot = DefaultCacheRoot())
                 and FileExists(ExpandConstant('{app}\var\cache\racket\compiled\.racket-installer-cache')) then begin
                Log('Prebuilt system cache matches this install path; skipping raco setup.');
                exit;
              end;
              // The shipped cache is keyed to the default path; drop it and
              // rebuild against the chosen locations.
              if DirExists(ExpandConstant('{app}\var\cache\racket\compiled')) then
                DelTree(ExpandConstant('{app}\var\cache\racket\compiled'), True, True, True);
              Params := '-NoProfile -ExecutionPolicy Bypass -File "' + ExpandConstant('{app}\installer-configure.ps1') +
                '" -InstallRoot "' + ExpandConstant('{app}') + '" -CacheRoot "' + CacheRoot + '"';
              if not Exec('powershell.exe', Params, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
                RaiseException('Failed to run Racket cache setup.');
              if ResultCode <> 0 then
                RaiseException('Racket cache setup failed with exit code ' + IntToStr(ResultCode) + '.');
            end;
          end;

          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          var
            CacheRoot: String;
          begin
            if CurUninstallStep = usUninstall then begin
              if RegQueryStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then begin
                if FileExists(AddBackslash(CacheRoot) + '.racket-installer-cache') then
                  DelTree(CacheRoot, True, True, True);
              end;
              RegDeleteKeyIncludingSubkeys(HKLM, 'Software\Racket9');
            end;
          end;
          "@ | Set-Content -Path racket-installer-cached.iss -Encoding UTF8

          & $env:ISCC_EXE racket-installer-cached.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup (cached) failed with exit $LASTEXITCODE"
          }
          $cachedInstallerPath = Join-Path "artifacts" $env:CACHED_EXE_NAME
          if (!(Test-Path $cachedInstallerPath) -or (Get-Item $cachedInstallerPath).Length -le 0) {
            throw "cached installer exe missing or empty: $cachedInstallerPath"
          }
          Get-FileHash $cachedInstallerPath -Algorithm SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 'windows-x86_64'
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error

  build-windows-arm64:
    name: build windows arm64
    runs-on: windows-11-arm
    permissions:
      contents: read
    env:
      PACKAGE_NAME: 'racket9'
      SOURCE_VERSION: '9.3.5'
      FORMULA_VERSION: '9.3.5.1'
      SOURCE_URL: 'https://github.com/CutieDeng/racket/releases/download/v9.3.5/racket-minimal-9.3.5-src.tgz'
      SOURCE_SHA256: 'dac88d1a7f1c104de93b31f385bdebe21c43cfbd9f3ca03c0d68050fae6e6663'
      ZIP_NAME: 'racket9-9.3.5.1-windows-arm64.zip'
      CACHED_ZIP_NAME: 'racket9-9.3.5.1-windows-arm64-cached.zip'
      EXE_NAME: 'racket9-9.3.5.1-windows-arm64-setup.exe'
      CACHED_EXE_NAME: 'racket9-9.3.5.1-windows-arm64-setup-cached.exe'
      PORTABLE_DIR: 'racket9'
      BUILD_JOBS: '2'
      MSVC_ARCH: 'arm64'
      NMAKE_TARGET: 'plain-install'
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@v6

      - name: Locate Visual Studio build tools
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsall)) {
            throw "vcvarsall.bat not found: $vcvarsall"
          }
          "VCVARSALL_BAT=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify source archive
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source | Out-Null
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source.tgz
          $actual = (Get-FileHash source.tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) {
            throw "Source sha256 mismatch: expected $env:SOURCE_SHA256 got $actual"
          }
          tar -xzf source.tgz -C source
          $entries = @(Get-ChildItem source -Directory)
          if ($entries.Count -ne 1) {
            Get-ChildItem source | Format-Table -AutoSize
            throw "source archive must contain exactly one top-level directory"
          }
          "SRC_DIR=$($entries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Racket with nmake
        shell: pwsh
        run: |
          $buildScript = @"
          @echo on
          call "%VCVARSALL_BAT%" %MSVC_ARCH%
          cd /d "%SRC_DIR%"
          if exist Makefile (
            echo Reusing existing top-level Makefile in %CD%
          ) else if exist src\winfig.bat (
            dir src\winfig.bat
            dir src\Makefile.nt
            dir src\buildmain.zuo
            call src\winfig.bat
            if not exist Makefile (
              echo winfig.bat did not create Makefile in %CD%
              dir
              exit /b 1
            )
          ) else (
            dir
            echo Neither top-level Makefile nor src\winfig.bat exists in %SRC_DIR%
            exit /b 1
          )
          for %%D in (bin lib share include etc) do (
            if exist "%%D" (
              if not exist "%%D\" (
                echo Expected install layout directory but found non-directory: %%D
                exit /b 1
              )
            ) else (
              mkdir "%%D"
            )
          )
          dir lib
          call :RunNmake all
          if errorlevel 1 exit /b %errorlevel%
          if /I "%NMAKE_TARGET%"=="all" goto after_nmake
          call :RunNmake %NMAKE_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          goto after_nmake
          :RunNmake
          echo Running nmake target %*
          nmake /f Makefile %* JOBS=%BUILD_JOBS%
          exit /b %errorlevel%
          :after_nmake
          "@
          Set-Content -Path build-racket.cmd -Value $buildScript -Encoding ASCII
          cmd.exe /c build-racket.cmd
          if ($LASTEXITCODE -ne 0) {
            if ($env:SRC_DIR) {
              Write-Host "Source root after failed nmake:"
              Get-ChildItem $env:SRC_DIR -Force | Select-Object -First 80 Mode, Length, FullName
              foreach ($relative in @("bin", "lib", "share", "include", "etc", "cs\c", "cs\c\lib")) {
                $candidate = Join-Path $env:SRC_DIR $relative
                if (Test-Path $candidate) {
                  Write-Host "Directory snapshot: $candidate"
                  Get-ChildItem $candidate -Force | Select-Object -First 80 Mode, Length, FullName
                } else {
                  Write-Host "Missing directory snapshot target: $candidate"
                }
              }
              Write-Host "Known Racket CS DLL files after failed nmake:"
              Get-ChildItem $env:SRC_DIR -Recurse -Filter libracketcs*.dll -ErrorAction SilentlyContinue |
                Select-Object -First 80 Mode, Length, FullName
            }
            throw "nmake build failed with exit $LASTEXITCODE"
          }

      - name: Install llvm-mingw (clang for librktcrypto DLL)
        shell: bash
        run: |
          set -euxo pipefail
          api="https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
                | grep -oE '"browser_download_url": *"[^"]*ucrt-aarch64\.zip"' \
                | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          echo "llvm-mingw asset: $url"
          test -n "$url"
          curl -fsSL "$url" -o llvm-mingw.zip
          mkdir -p "$HOME/llvm-mingw"
          unzip -q llvm-mingw.zip -d "$HOME/llvm-mingw"
          bindir=$(dirname "$(find "$HOME/llvm-mingw" -name clang.exe | head -1)")
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/aarch64-w64-mingw32-clang" --version

      - name: Build librktcrypto.dll with clang
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          crypto=$(dirname "$(find "$src/src" -name rktcrypto_ecc.c | head -1)")
          echo "librktcrypto sources: $crypto"
          test -n "$crypto"
          mkdir -p dllbuild
          grep -o '"rktcrypto[^"]*\.[cS]"' "$crypto/build.zuo" | tr -d '"' > dllbuild/sources.txt
          n=$(wc -l < dllbuild/sources.txt)
          echo "librktcrypto source count: $n"
          test "$n" -ge 70
          cc=aarch64-w64-mingw32-clang
          cat dllbuild/sources.txt | xargs -P 4 -I@SRC@ sh -c "$cc -c -O3 -I'$crypto' -o 'dllbuild/@SRC@.o' '$crypto/@SRC@'"
          $cc -shared -o dllbuild/librktcrypto.dll dllbuild/*.o "$crypto/rktcrypto.def" -lbcrypt
          cp dllbuild/librktcrypto.dll "$src/"
          ls -l "$src/librktcrypto.dll"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = Get-ChildItem $programFilesX86 -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$iscc -or !(Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble portable zip
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force portable, artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force portable, artifacts | Out-Null
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          foreach ($name in @("collects", "etc", "lib", "share", "include", "doc")) {
            $source = Join-Path $env:SRC_DIR $name
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $portableRoot $name) -Recurse -Force
            } else {
              Write-Host "Skipping absent optional runtime directory: $source"
            }
          }
          Get-ChildItem -LiteralPath $env:SRC_DIR -File |
            Where-Object { $_.Name -match '\.(exe|dll|def)$' -or $_.Name -eq "README" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $portableRoot -Force }
          foreach ($required in @("collects", "etc", "lib", "share")) {
            $requiredPath = Join-Path $portableRoot $required
            if (!(Test-Path $requiredPath)) {
              Get-ChildItem -LiteralPath $env:SRC_DIR -Force | Select-Object -First 120 Mode, Length, FullName
              throw "required portable runtime path missing: $requiredPath"
            }
          }
          $racketExe = Get-ChildItem $portableRoot -Recurse -Filter Racket.exe | Sort-Object FullName | Select-Object -First 1
          $racoExe = Get-ChildItem $portableRoot -Recurse -Filter raco.exe | Sort-Object FullName | Select-Object -First 1
          if (!$racketExe) {
            Write-Host "Source root files:"
            Get-ChildItem -LiteralPath $env:SRC_DIR -Force | Select-Object -First 120 Mode, Length, FullName
            Write-Host "Portable files:"
            Get-ChildItem $portableRoot -Recurse -File | Select-Object -First 120 FullName
            throw "racket.exe not found in portable tree"
          }
          if ($racoExe) {
            $racoCommand = $racoExe.FullName
            $racoArgs = @("pkg", "show", "--all")
          } else {
            $racoCmd = Join-Path $racketExe.DirectoryName "raco.cmd"
            @(
              "@echo off",
              "`"%~dp0$($racketExe.Name)`" -N raco -l- raco %*"
            ) | Set-Content -Path $racoCmd -Encoding ASCII
            $racoCommand = $racketExe.FullName
            $racoArgs = @("-N", "raco", "-l-", "raco", "pkg", "show", "--all")
          }
          & $racketExe.FullName -e '(displayln (version))' | Tee-Object -Variable versionOut
          if ($versionOut -notmatch [regex]::Escape($env:SOURCE_VERSION)) {
            throw "Racket version output does not include $env:SOURCE_VERSION: $versionOut"
          }
          & $racketExe.FullName -e '(displayln "windows-portable-ok")'
          if ($LASTEXITCODE -ne 0) {
            throw "Racket smoke check failed with exit $LASTEXITCODE"
          }
          & $racketExe.FullName -e '(require openssl racket/port) (unless ssl-available? (error (quote tls) "ssl-available? is #f: librktcrypto.dll missing next to Racket.exe")) (define-values (i o) (ssl-connect "example.com" 443 (quote secure))) (write-string "GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n" o) (flush-output o) (define s (read-line i)) (close-input-port i) (close-output-port o) (unless (regexp-match? #rx"200" s) (error (quote tls) s)) (displayln "windows-tls-ok")' | Tee-Object -Variable tlsOut
          if ($LASTEXITCODE -ne 0) {
            throw "Windows TLS smoke failed with exit $LASTEXITCODE"
          }
          if (($tlsOut -join "`n") -notmatch 'windows-tls-ok') {
            throw "Windows TLS smoke did not print windows-tls-ok"
          }
          & $racketExe.FullName -e '(require racket/random/generator) (unless rktrandom-available? (error (quote rktrandom) "rktrandom-available? is #f: librktrandom not linked into Racket.exe")) (define g (make-rgen 42)) (define xs (for/list ([i (in-range 4)]) (rgen-u64 g))) (unless (equal? xs (list 17334047174172577666 1019500725184315962 11076454993390921235 13198794054228246118)) (error (quote rktrandom) "seed-42 xoshiro256++ stream diverges from the Unix reference" xs)) (displayln "windows-rktrandom-ok")' | Tee-Object -Variable rndOut
          if ($LASTEXITCODE -ne 0) {
            throw "Windows rktrandom smoke failed with exit $LASTEXITCODE"
          }
          if (($rndOut -join "`n") -notmatch 'windows-rktrandom-ok') {
            throw "Windows rktrandom smoke did not print windows-rktrandom-ok"
          }
          & $racoCommand @racoArgs | Select-Object -First 40
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "raco package listing failed with exit $LASTEXITCODE; keeping portable artifact because Racket smoke check passed"
            $global:LASTEXITCODE = 0
          }
          @(
            "Racket portable build",
            "Source: $env:SOURCE_URL",
            "Version: $env:SOURCE_VERSION",
            "Package version: $env:FORMULA_VERSION",
            "Find Racket.exe inside this directory. If raco.exe is absent, use raco.cmd next to Racket.exe."
          ) | Set-Content -Path (Join-Path $portableRoot "README-portable.txt") -Encoding UTF8
          $artifactPath = Join-Path "artifacts" $env:ZIP_NAME
          Compress-Archive -Path $portableRoot -DestinationPath $artifactPath -Force
          if ((Get-Item $artifactPath).Length -le 0) {
            throw "portable zip is empty: $artifactPath"
          }
          Get-FileHash $artifactPath -Algorithm SHA256

      - name: Build cached portable zip (in-tree compiled)
        shell: pwsh
        run: |
          # A portable zip must work at ANY extraction path, so unlike the
          # cached installer's path-keyed system cache this variant uses the
          # classic in-tree compiled/ model: zo next to sources, config left
          # pristine, location-independent. Two setup passes: the first
          # bootstraps from source on the zo-less tree and does not
          # self-validate; the second converges the deps.
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          New-Item -ItemType Directory -Force "portable-zipcached" | Out-Null
          $zipRoot = Join-Path "portable-zipcached" $env:PORTABLE_DIR
          Copy-Item -LiteralPath $portableRoot -Destination $zipRoot -Recurse
          $racketExe = Join-Path $zipRoot 'Racket.exe'
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) {
            throw "in-tree setup pass 1 failed with exit $LASTEXITCODE"
          }
          & $racketExe -N raco -l- raco setup --no-user -D --no-pkg-deps --no-launcher
          if ($LASTEXITCODE -ne 0) {
            throw "in-tree setup pass 2 failed with exit $LASTEXITCODE"
          }
          $zos = (Get-ChildItem -LiteralPath $zipRoot -Recurse -Filter *.zo | Measure-Object).Count
          if ($zos -lt 500) {
            throw "suspiciously few in-tree zos: $zos"
          }
          Write-Host "cached zip payload: $zos in-tree zos"
          $cachedZipPath = Join-Path "artifacts" $env:CACHED_ZIP_NAME
          Compress-Archive -Path $zipRoot -DestinationPath $cachedZipPath -Force
          if ((Get-Item $cachedZipPath).Length -le 0) {
            throw "cached portable zip is empty: $cachedZipPath"
          }
          Get-FileHash $cachedZipPath -Algorithm SHA256

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          if (!(Test-Path $portableRoot)) {
            throw "portable tree missing: $portableRoot"
          }
          @'
          param(
            [Parameter(Mandatory=$true)] [string] $InstallRoot,
            [Parameter(Mandatory=$true)] [string] $CacheRoot
          )

          $ErrorActionPreference = 'Stop'

          function Test-DirectoryEmpty([string] $Path) {
            if (!(Test-Path -LiteralPath $Path)) { return $true }
            return -not (Get-ChildItem -LiteralPath $Path -Force -ErrorAction Stop | Select-Object -First 1)
          }

          $CacheRoot = [IO.Path]::GetFullPath($CacheRoot)
          $root = [IO.Path]::GetPathRoot($CacheRoot).TrimEnd('\')
          if ([string]::IsNullOrWhiteSpace($CacheRoot) -or ($CacheRoot.TrimEnd('\') -eq $root)) {
            throw "Refusing unsafe cache path: $CacheRoot"
          }

          $marker = Join-Path $CacheRoot '.racket-installer-cache'
          if ((Test-Path -LiteralPath $CacheRoot) -and
              !(Test-Path -LiteralPath $marker) -and
              !(Test-DirectoryEmpty $CacheRoot)) {
            throw "Cache path exists and is not empty or installer-owned: $CacheRoot"
          }

          New-Item -ItemType Directory -Force $CacheRoot | Out-Null
          Set-Content -LiteralPath $marker -Value 'Racket installer owned cache directory' -Encoding ASCII

          $configPath = Join-Path $InstallRoot 'etc\config.rktd'
          if (!(Test-Path -LiteralPath $configPath)) {
            throw "Racket config not found: $configPath"
          }
          $configText = Get-Content -LiteralPath $configPath -Raw
          foreach ($key in @('default-scope', 'compiled-file-cache-roots', 'compiled-file-system-cache-root')) {
            $pattern = '\s*\(' + [regex]::Escape($key) + '\s+\.\s+("[^"]*"|\([^)]*\)|[^)]*)\)'
            $configText = [regex]::Replace($configText, $pattern, '')
          }
          $configText = $configText.Replace('"../../share/racket/self-catalog"', '"../share/self-catalog"')
          $cacheForConfig = $CacheRoot.Replace('\', '/').Replace('"', '\"')
          $entries = ' (default-scope . "installation") (compiled-file-cache-roots . (user system)) (compiled-file-system-cache-root . "' + $cacheForConfig + '")'
          # The final "))" is <last-entry-close><hash-close>: re-close the
          # last entry BEFORE splicing the new entries, then close the hash.
          $configText = [regex]::Replace($configText, '\s*\)\)\s*$', ')' + $entries + ")`r`n")
          if ($configText -notmatch '\(compiled-file-system-cache-root \.' ) {
            throw 'Unable to configure Racket system cache root'
          }
          Set-Content -LiteralPath $configPath -Value $configText -Encoding UTF8

          $racoExe = Join-Path $InstallRoot 'raco.exe'
          $racketExe = Join-Path $InstallRoot 'Racket.exe'
          if (Test-Path -LiteralPath $racketExe) {
            # No double quotes in the -e argument: this script runs under
            # Windows PowerShell 5.1 (Inno launches powershell.exe), whose
            # native argument passing mangles embedded quotes.
            $env:RACKET_INSTALLER_CONFIG_CHECK = $configPath
            & $racketExe -e '(void (call-with-input-file (getenv (symbol->string (quote RACKET_INSTALLER_CONFIG_CHECK))) read))'
            if ($LASTEXITCODE -ne 0) {
              throw "rewritten config.rktd is not readable Racket data: $configPath"
            }
          }
          if (Test-Path -LiteralPath $racoExe) {
            & $racoExe setup --system --no-user --reset-cache -D --no-pkg-deps
          } elseif (Test-Path -LiteralPath $racketExe) {
            & $racketExe -N raco -l- raco setup --system --no-user --reset-cache -D --no-pkg-deps
          } else {
            throw "Neither raco.exe nor Racket.exe exists in $InstallRoot"
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          '@ | Set-Content -Path (Join-Path $portableRoot "installer-configure.ps1") -Encoding UTF8

          $outputBase = [IO.Path]::GetFileNameWithoutExtension($env:EXE_NAME)
          @"
          [Setup]
          AppId=racket9
          AppName=Racket
          AppVersion=$env:FORMULA_VERSION
          DefaultDirName={autopf}\Racket9
          DefaultGroupName=Racket 9
          DisableProgramGroupPage=yes
          OutputDir=artifacts
          OutputBaseFilename=$outputBase
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=arm64
          ArchitecturesInstallIn64BitMode=arm64
          PrivilegesRequired=admin
          WizardStyle=modern

          [Files]
          Source: "portable\$env:PORTABLE_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Racket"; Filename: "{app}\Racket.exe"
          Name: "{group}\Uninstall Racket"; Filename: "{uninstallexe}"

          [Code]
          var
            CachePage: TInputDirWizardPage;
            CacheDefaultRoot: String;

          function DefaultCacheRoot(): String;
          begin
            Result := ExpandConstant('{app}\var\cache\racket\compiled');
          end;

          function GetCacheRoot(Param: String): String;
          var
            Value: String;
          begin
            Value := ExpandConstant('{param:CACHEPATH|}');
            if Value <> '' then
              Result := Value
            else if Assigned(CachePage) and (Trim(CachePage.Values[0]) <> '') then
              Result := CachePage.Values[0]
            else
              Result := DefaultCacheRoot();
          end;

          procedure InitializeWizard;
          begin
            CachePage := CreateInputDirPage(wpSelectDir, 'Racket Cache Directory',
              'Choose the compiled cache directory.',
              'Racket builds the system cache during installation. For unattended installs, pass /CACHEPATH=...',
              False, '');
            CachePage.Add('');
            // {app} is not initialized yet; CurPageChanged fills in the
            // default when the page is entered (silent installs never enter
            // it and fall back inside GetCacheRoot at ssPostInstall).
            CacheDefaultRoot := '';
            CachePage.Values[0] := '';
          end;

          procedure CurPageChanged(CurPageID: Integer);
          begin
            if Assigned(CachePage) and (CurPageID = CachePage.ID) then
              if (CachePage.Values[0] = '') or (CachePage.Values[0] = CacheDefaultRoot) then begin
                CacheDefaultRoot := DefaultCacheRoot();
                CachePage.Values[0] := CacheDefaultRoot;
              end;
          end;

          function NextButtonClick(CurPageID: Integer): Boolean;
          begin
            Result := True;
            if Assigned(CachePage) and (CurPageID = CachePage.ID) and (Trim(CachePage.Values[0]) = '') then begin
              MsgBox('Cache path is required.', mbError, MB_OK);
              Result := False;
            end;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
            Params: String;
          begin
            if CurStep = ssPostInstall then begin
              if not RegWriteStringValue(HKLM, 'Software\Racket9', 'CacheRoot', GetCacheRoot('')) then
                RaiseException('Failed to save Racket cache path.');
              Params := '-NoProfile -ExecutionPolicy Bypass -File "' + ExpandConstant('{app}\installer-configure.ps1') +
                '" -InstallRoot "' + ExpandConstant('{app}') + '" -CacheRoot "' + GetCacheRoot('') + '"';
              if not Exec('powershell.exe', Params, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
                RaiseException('Failed to run Racket cache setup.');
              if ResultCode <> 0 then
                RaiseException('Racket cache setup failed with exit code ' + IntToStr(ResultCode) + '.');
            end;
          end;

          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          var
            CacheRoot: String;
          begin
            if CurUninstallStep = usUninstall then begin
              if RegQueryStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then begin
                if FileExists(AddBackslash(CacheRoot) + '.racket-installer-cache') then
                  DelTree(CacheRoot, True, True, True);
              end;
              RegDeleteKeyIncludingSubkeys(HKLM, 'Software\Racket9');
            end;
          end;
          "@ | Set-Content -Path racket-installer.iss -Encoding UTF8

          & $env:ISCC_EXE racket-installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit $LASTEXITCODE"
          }
          $installerPath = Join-Path "artifacts" $env:EXE_NAME
          if (!(Test-Path $installerPath) -or (Get-Item $installerPath).Length -le 0) {
            throw "installer exe missing or empty: $installerPath"
          }
          Get-FileHash $installerPath -Algorithm SHA256

      - name: Build cached installer (prebuilt system cache)
        shell: pwsh
        run: |
          $portableRoot = Join-Path "portable" $env:PORTABLE_DIR
          # The runtime-keyed system compiled cache is keyed by absolute
          # source path (setup/compiled-cache.rkt), so the shipped cache is
          # valid only for the default install location. Stage the payload
          # there, run the SAME configure script the plain installer runs on
          # the user's machine, and package the result.
          $installRoot = 'C:\Program Files\Racket9'
          if (Test-Path -LiteralPath $installRoot) {
            throw "unexpected existing install root: $installRoot"
          }
          Copy-Item -LiteralPath $portableRoot -Destination $installRoot -Recurse
          $cacheRoot = Join-Path $installRoot 'var\cache\racket\compiled'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installRoot 'installer-configure.ps1') -InstallRoot $installRoot -CacheRoot $cacheRoot
          if ($LASTEXITCODE -ne 0) {
            throw "CI system-cache raco setup failed with exit $LASTEXITCODE"
          }
          # The portable tree ships no in-tree .zo, so the first setup
          # bootstraps from source and its cache does not self-validate; a
          # second pass converges the deps so installed caches no-op under
          # any later raco setup.
          $racketExe = Join-Path $installRoot 'Racket.exe'
          & $racketExe -N raco -l- raco setup --system --no-user -D --no-pkg-deps
          if ($LASTEXITCODE -ne 0) {
            throw "CI system-cache converge setup failed with exit $LASTEXITCODE"
          }
          $count = (Get-ChildItem -LiteralPath $cacheRoot -Recurse -File | Measure-Object).Count
          if ($count -lt 100) {
            throw "suspiciously small system cache: $count files"
          }
          Write-Host "cached payload: $count system-cache files"
          New-Item -ItemType Directory -Force "portable-cached" | Out-Null
          $cachedRoot = Join-Path "portable-cached" $env:PORTABLE_DIR
          Copy-Item -LiteralPath $installRoot -Destination $cachedRoot -Recurse
          Remove-Item -Recurse -Force -LiteralPath $installRoot
          $outputBase = [IO.Path]::GetFileNameWithoutExtension($env:CACHED_EXE_NAME)
          @"
          [Setup]
          AppId=racket9
          AppName=Racket
          AppVersion=$env:FORMULA_VERSION
          DefaultDirName={autopf}\Racket9
          DefaultGroupName=Racket 9
          DisableProgramGroupPage=yes
          OutputDir=artifacts
          OutputBaseFilename=$outputBase
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=arm64
          ArchitecturesInstallIn64BitMode=arm64
          PrivilegesRequired=admin
          WizardStyle=modern

          [Files]
          Source: "portable-cached\$env:PORTABLE_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Racket"; Filename: "{app}\Racket.exe"
          Name: "{group}\Uninstall Racket"; Filename: "{uninstallexe}"

          [Code]
          var
            CachePage: TInputDirWizardPage;
            CacheDefaultRoot: String;

          function DefaultCacheRoot(): String;
          begin
            Result := ExpandConstant('{app}\var\cache\racket\compiled');
          end;

          function GetCacheRoot(Param: String): String;
          var
            Value: String;
          begin
            Value := ExpandConstant('{param:CACHEPATH|}');
            if Value <> '' then
              Result := Value
            else if Assigned(CachePage) and (Trim(CachePage.Values[0]) <> '') then
              Result := CachePage.Values[0]
            else
              Result := DefaultCacheRoot();
          end;

          procedure InitializeWizard;
          begin
            CachePage := CreateInputDirPage(wpSelectDir, 'Racket Cache Directory',
              'Choose the compiled cache directory.',
              'This installer ships a prebuilt cache for the default install directory; keeping the defaults skips the cache build. A custom directory rebuilds the cache during installation. For unattended installs, pass /CACHEPATH=...',
              False, '');
            CachePage.Add('');
            // {app} is not initialized yet; CurPageChanged fills in the
            // default when the page is entered (silent installs never enter
            // it and fall back inside GetCacheRoot at ssPostInstall).
            CacheDefaultRoot := '';
            CachePage.Values[0] := '';
          end;

          procedure CurPageChanged(CurPageID: Integer);
          begin
            if Assigned(CachePage) and (CurPageID = CachePage.ID) then
              if (CachePage.Values[0] = '') or (CachePage.Values[0] = CacheDefaultRoot) then begin
                CacheDefaultRoot := DefaultCacheRoot();
                CachePage.Values[0] := CacheDefaultRoot;
              end;
          end;

          function NextButtonClick(CurPageID: Integer): Boolean;
          begin
            Result := True;
            if Assigned(CachePage) and (CurPageID = CachePage.ID) and (Trim(CachePage.Values[0]) = '') then begin
              MsgBox('Cache path is required.', mbError, MB_OK);
              Result := False;
            end;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
            Params: String;
            CacheRoot: String;
          begin
            if CurStep = ssPostInstall then begin
              CacheRoot := GetCacheRoot('');
              if not RegWriteStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then
                RaiseException('Failed to save Racket cache path.');
              if (ExpandConstant('{app}') = ExpandConstant('{autopf}\Racket9'))
                 and (CacheRoot = DefaultCacheRoot())
                 and FileExists(ExpandConstant('{app}\var\cache\racket\compiled\.racket-installer-cache')) then begin
                Log('Prebuilt system cache matches this install path; skipping raco setup.');
                exit;
              end;
              // The shipped cache is keyed to the default path; drop it and
              // rebuild against the chosen locations.
              if DirExists(ExpandConstant('{app}\var\cache\racket\compiled')) then
                DelTree(ExpandConstant('{app}\var\cache\racket\compiled'), True, True, True);
              Params := '-NoProfile -ExecutionPolicy Bypass -File "' + ExpandConstant('{app}\installer-configure.ps1') +
                '" -InstallRoot "' + ExpandConstant('{app}') + '" -CacheRoot "' + CacheRoot + '"';
              if not Exec('powershell.exe', Params, '', SW_HIDE, ewWaitUntilTerminated, ResultCode) then
                RaiseException('Failed to run Racket cache setup.');
              if ResultCode <> 0 then
                RaiseException('Racket cache setup failed with exit code ' + IntToStr(ResultCode) + '.');
            end;
          end;

          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          var
            CacheRoot: String;
          begin
            if CurUninstallStep = usUninstall then begin
              if RegQueryStringValue(HKLM, 'Software\Racket9', 'CacheRoot', CacheRoot) then begin
                if FileExists(AddBackslash(CacheRoot) + '.racket-installer-cache') then
                  DelTree(CacheRoot, True, True, True);
              end;
              RegDeleteKeyIncludingSubkeys(HKLM, 'Software\Racket9');
            end;
          end;
          "@ | Set-Content -Path racket-installer-cached.iss -Encoding UTF8

          & $env:ISCC_EXE racket-installer-cached.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup (cached) failed with exit $LASTEXITCODE"
          }
          $cachedInstallerPath = Join-Path "artifacts" $env:CACHED_EXE_NAME
          if (!(Test-Path $cachedInstallerPath) -or (Get-Item $cachedInstallerPath).Length -le 0) {
            throw "cached installer exe missing or empty: $cachedInstallerPath"
          }
          Get-FileHash $cachedInstallerPath -Algorithm SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 'windows-arm64'
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error

  publish-windows-portable:
    needs: [build-windows-x86_64, build-windows-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows portable artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: 'windows-*'
          merge-multiple: true
          path: release-assets

      - name: Publish Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: 'CutieDeng/win-racket'
          RELEASE_TAG: 'v9.3.5'
          RELEASE_NAME: 'Racket 9.3.5 Windows portable'
          CREATE_RELEASE: 'true'
          EXPECTED_ASSETS: '2'
          EXPECTED_ZIPS: '4'
          EXPECTED_EXES: '4'
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo 'gh CLI is required on the publish runner'; exit 1; }
          mapfile -t zip_files < <(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name '*.zip' -type f | sort)
          mapfile -t exe_files < <(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name '*.exe' -type f | sort)
          if [ "${#zip_files[@]}" -ne "$EXPECTED_ZIPS" ]; then
            printf 'Expected %s Windows portable zips, got %s\n' "$EXPECTED_ZIPS" "${#zip_files[@]}"
            printf '  %s\n' "${zip_files[@]}"
            exit 1
          fi
          if [ "${#exe_files[@]}" -ne "$EXPECTED_EXES" ]; then
            printf 'Expected %s Windows installer exes, got %s\n' "$EXPECTED_EXES" "${#exe_files[@]}"
            printf '  %s\n' "${exe_files[@]}"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            if [ "$CREATE_RELEASE" != true ]; then
              echo "GitHub release does not exist and create-release is false: $RELEASE_REPO $RELEASE_TAG"
              exit 1
            fi
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --title "$RELEASE_NAME" --notes "Generated Windows Racket artifacts."
          fi
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" "${zip_files[@]}" "${exe_files[@]}" --clobber
