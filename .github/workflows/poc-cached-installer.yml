# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal: validate the cached-installer design in WINDOWS-CACHED-INSTALLER-PLAN.md
# (package-racket repo) before wiring it into windows-ci-build-job. Questions:
#   1. Can CI build the runtime-keyed system compiled cache against the final
#      install path (C:\Program Files\Racket9) from the RELEASED portable zip,
#      and how long does that raco setup take (= what a cached install saves)?
#   2. Does the cache survive repackage -> wipe -> re-extract (the Inno file
#      copy, approximated with bsdtar which preserves mtimes): a second
#      raco setup without --reset-cache must be a NO-OP (unchanged file count,
#      no file newer than a pre-run marker), proving mtime validity holds.
#   3. Size/time numbers for the release notes.

name: poc cached installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-cached-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_BASE: 'https://github.com/CutieDeng/win-racket/releases/download/v9.3.3'
  FORMULA_VERSION: '9.3.3.1'
  INSTALL_ROOT: 'C:\Program Files\Racket9'
  CACHE_ROOT: 'C:\Program Files\Racket9\var\cache\racket\compiled'

jobs:
  poc-cached:
    name: cached ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Download released portable zip
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL "$RELEASE_BASE/racket9-$FORMULA_VERSION-windows-${{ matrix.arch }}.zip" -o portable.zip
          ls -l portable.zip

      - name: Extract to final install path
        shell: bash
        run: |
          set -euxo pipefail
          mkdir extracted
          tar -xf portable.zip -C extracted
          test -d "extracted/racket9"
          dest=$(cygpath -u "$INSTALL_ROOT")
          test ! -e "$dest"
          mv "extracted/racket9" "$dest"
          test -f "$dest/Racket.exe"

      - name: Configure cache root and build system cache (timed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallRoot = $env:INSTALL_ROOT
          $CacheRoot = $env:CACHE_ROOT
          New-Item -ItemType Directory -Force $CacheRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $CacheRoot '.racket-installer-cache') -Value 'Racket installer owned cache directory' -Encoding ASCII
          $configPath = Join-Path $InstallRoot 'etc\config.rktd'
          $configText = Get-Content -LiteralPath $configPath -Raw
          foreach ($key in @('default-scope', 'compiled-file-cache-roots', 'compiled-file-system-cache-root')) {
            $pattern = '\s*\(' + [regex]::Escape($key) + '\s+\.\s+("[^"]*"|\([^)]*\)|[^)]*)\)'
            $configText = [regex]::Replace($configText, $pattern, '')
          }
          $configText = $configText.Replace('"../../share/racket/self-catalog"', '"../share/self-catalog"')
          $cacheForConfig = $CacheRoot.Replace('\', '/').Replace('"', '\"')
          $entries = ' (default-scope . "installation") (compiled-file-cache-roots . (user system)) (compiled-file-system-cache-root . "' + $cacheForConfig + '")'
          $configText = [regex]::Replace($configText, '\s*\)\)\s*$', $entries + "))`r`n")
          if ($configText -notmatch '\(compiled-file-system-cache-root \.') { throw 'config rewrite failed' }
          Set-Content -LiteralPath $configPath -Value $configText -Encoding UTF8
          $racketExe = Join-Path $InstallRoot 'Racket.exe'
          $racoExe = Join-Path $InstallRoot 'raco.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          if (Test-Path -LiteralPath $racoExe) {
            & $racoExe setup --system --no-user --reset-cache -D --no-pkg-deps
          } else {
            & $racketExe -N raco -l- raco setup --system --no-user --reset-cache -D --no-pkg-deps
          }
          if ($LASTEXITCODE -ne 0) { throw "cache raco setup failed: $LASTEXITCODE" }
          $sw.Stop()
          $count = (Get-ChildItem -LiteralPath $CacheRoot -Recurse -File | Measure-Object).Count
          $bytes = (Get-ChildItem -LiteralPath $CacheRoot -Recurse -File | Measure-Object Length -Sum).Sum
          if ($count -lt 100) { throw "suspiciously small cache: $count files" }
          Write-Host ("CACHE-BUILD seconds={0:N0} files={1} mb={2:N1}" -f $sw.Elapsed.TotalSeconds, $count, ($bytes/1MB))
          "CACHE_FILES=$count" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Repackage tree+cache, wipe, re-extract (simulated install copy)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$(cygpath -u 'C:\Program Files')"
          tar -a -cf "$GITHUB_WORKSPACE/cached-tree.zip" Racket9
          ls -l "$GITHUB_WORKSPACE/cached-tree.zip" portable.zip 2>/dev/null || ls -l "$GITHUB_WORKSPACE/cached-tree.zip"
          rm -rf Racket9
          test ! -e Racket9
          tar -xf "$GITHUB_WORKSPACE/cached-tree.zip"
          test -f "Racket9/Racket.exe"
          test -f "Racket9/var/cache/racket/compiled/.racket-installer-cache"

      - name: Runtime smoke after re-extract (HARD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $racketExe = Join-Path $env:INSTALL_ROOT 'Racket.exe'
          & $racketExe -e '(displayln (version))' | Tee-Object -Variable v
          if ($v -notmatch '9\.3\.3') { throw "unexpected version: $v" }
          & $racketExe -e '(require racket/random/generator) (unless rktrandom-available? (error (quote poc) "rktrandom unavailable")) (define g (make-rgen 42)) (unless (equal? (for/list ([i (in-range 4)]) (rgen-u64 g)) (list 17334047174172577666 1019500725184315962 11076454993390921235 13198794054228246118)) (error (quote poc) "prng stream mismatch")) (require openssl) (unless ssl-available? (error (quote poc) "ssl unavailable")) (displayln "cached-smoke-ok")' | Tee-Object -Variable s
          if ($LASTEXITCODE -ne 0) { throw "smoke failed: $LASTEXITCODE" }
          if (($s -join "`n") -notmatch 'cached-smoke-ok') { throw 'smoke marker missing' }

      - name: Cache validity after re-extract (HARD; second setup must no-op)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $CacheRoot = $env:CACHE_ROOT
          $before = (Get-ChildItem -LiteralPath $CacheRoot -Recurse -File | Measure-Object).Count
          if ("$before" -ne $env:CACHE_FILES) { throw "cache file count changed across repackage: $before vs $env:CACHE_FILES" }
          Start-Sleep -Seconds 2
          $marker = Get-Date
          $racketExe = Join-Path $env:INSTALL_ROOT 'Racket.exe'
          $racoExe = Join-Path $env:INSTALL_ROOT 'raco.exe'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          if (Test-Path -LiteralPath $racoExe) {
            & $racoExe setup --system --no-user -D --no-pkg-deps
          } else {
            & $racketExe -N raco -l- raco setup --system --no-user -D --no-pkg-deps
          }
          if ($LASTEXITCODE -ne 0) { throw "revalidation raco setup failed: $LASTEXITCODE" }
          $sw.Stop()
          $after = (Get-ChildItem -LiteralPath $CacheRoot -Recurse -File | Measure-Object).Count
          $rebuilt = @(Get-ChildItem -LiteralPath $CacheRoot -Recurse -File | Where-Object { $_.LastWriteTime -gt $marker })
          Write-Host ("REVALIDATE seconds={0:N0} files={1}->{2} rebuilt={3}" -f $sw.Elapsed.TotalSeconds, $before, $after, $rebuilt.Count)
          if ($after -ne $before) { throw "second setup changed cache file count: $before -> $after" }
          if ($rebuilt.Count -gt 0) {
            $rebuilt | Select-Object -First 20 FullName | Format-Table -AutoSize
            throw "second setup rewrote $($rebuilt.Count) cache files: mtime validity did NOT survive repackaging"
          }
          Write-Host "PoC OK: cache built at final path survives repackage+re-extract bit-for-bit valid on ${{ matrix.arch }}."
