# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal (P2 of the Windows crypto story): verify that librktcrypto builds as a
# clang (llvm-mingw) DLL on BOTH Windows arches, that the rktcrypto TLS backend
# loads it via the new two-stage ffi-lib resolution (racket fork commit
# d16138335f), and that a REAL verified TLS connection works end-to-end using
# trust anchors enumerated from the Windows ROOT certificate store (crypt32).
# Success here means Windows reaches openssl-collection parity with Unix/macOS
# (ssl-available? #t, ssl-connect 'secure, net/url https) with zero OpenSSL.

name: poc rktcrypto win tls

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-rktcrypto-win-tls.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_VERSION: '9.3.1'
  SOURCE_URL: 'https://github.com/CutieDeng/racket/releases/download/v9.3.1/racket-minimal-9.3.1-src.tgz'
  SOURCE_SHA256: '82c5ea4c2e406b14b69ff7255ee34358f4abb0c1eee635e256562a0ca816f85d'
  # Fork commit providing the DLL-aware rktcrypto-ffi + win32-store loader.
  COLLECTS_COMMIT: 'd16138335feceb4f54bce78a9c13179f658a8160'
  BUILD_JOBS: '2'
  NMAKE_TARGET: 'plain-install'

jobs:
  poc-tls:
    name: rktcrypto tls ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            msvc_arch: x64
            mingw_target: x86_64
            llvm_zip_arch: x86_64
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            mingw_target: aarch64
            llvm_zip_arch: aarch64
    env:
      MSVC_ARCH: ${{ matrix.msvc_arch }}
    steps:
      - name: Locate Visual Studio build tools
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw "Visual Studio was not found" }
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsall)) { throw "vcvarsall.bat not found: $vcvarsall" }
          "VCVARSALL_BAT=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify source archive
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source | Out-Null
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source.tgz
          $actual = (Get-FileHash source.tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) { throw "Source sha256 mismatch: expected $env:SOURCE_SHA256 got $actual" }
          tar -xzf source.tgz -C source
          $entries = @(Get-ChildItem source -Directory)
          if ($entries.Count -ne 1) { Get-ChildItem source | Format-Table -AutoSize; throw "source archive must contain exactly one top-level directory" }
          "SRC_DIR=$($entries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Racket with nmake (${{ matrix.msvc_arch }})
        shell: pwsh
        run: |
          $buildScript = @"
          @echo on
          call "%VCVARSALL_BAT%" %MSVC_ARCH%
          cd /d "%SRC_DIR%"
          if exist Makefile (
            echo Reusing existing top-level Makefile in %CD%
          ) else if exist src\winfig.bat (
            call src\winfig.bat
            if not exist Makefile ( echo winfig.bat did not create Makefile & dir & exit /b 1 )
          ) else (
            dir & echo Neither top-level Makefile nor src\winfig.bat exists & exit /b 1
          )
          for %%D in (bin lib share include etc) do ( if not exist "%%D" mkdir "%%D" )
          call :RunNmake all
          if errorlevel 1 exit /b %errorlevel%
          call :RunNmake %NMAKE_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          goto after_nmake
          :RunNmake
          echo Running nmake target %*
          nmake /f Makefile %* JOBS=%BUILD_JOBS%
          exit /b %errorlevel%
          :after_nmake
          "@
          Set-Content -Path build-racket.cmd -Value $buildScript -Encoding ASCII
          cmd.exe /c build-racket.cmd
          if ($LASTEXITCODE -ne 0) { throw "nmake build failed with exit $LASTEXITCODE" }

      - name: Install llvm-mingw (clang cross toolchain, windows host)
        shell: bash
        run: |
          set -euxo pipefail
          api="https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
                | grep -oE '"browser_download_url": *"[^"]*ucrt-${{ matrix.llvm_zip_arch }}\.zip"' \
                | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          echo "llvm-mingw asset: $url"
          test -n "$url"
          curl -fsSL "$url" -o llvm-mingw.zip
          mkdir -p "$HOME/llvm-mingw"
          unzip -q llvm-mingw.zip -d "$HOME/llvm-mingw"
          bindir=$(dirname "$(find "$HOME/llvm-mingw" -name clang.exe | head -1)")
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/${{ matrix.mingw_target }}-w64-mingw32-clang" --version

      - name: Build librktcrypto.dll with clang
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          crypto=$(dirname "$(find "$src" -name rktcrypto_ecc.c | head -1)")
          echo "crypto sources: $crypto"
          mkdir -p dllbuild
          grep -o '"rktcrypto[^"]*\.[cS]"' "$crypto/build.zuo" | tr -d '"' > dllbuild/sources.txt
          n=$(wc -l < dllbuild/sources.txt)
          echo "source count: $n"
          test "$n" -ge 70
          cc="${{ matrix.mingw_target }}-w64-mingw32-clang"
          cat dllbuild/sources.txt | xargs -P 4 -I{} sh -c \
            "$cc -c -O3 -I'$crypto' -o 'dllbuild/{}.o' '$crypto/{}'"
          $cc -shared -o dllbuild/librktcrypto.dll dllbuild/*.o "$crypto/rktcrypto.def" -lbcrypt
          ls -l dllbuild/librktcrypto.dll

      - name: Install DLL-aware collects (pinned fork commit) and the DLL
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          raw="https://raw.githubusercontent.com/CutieDeng/racket/$COLLECTS_COMMIT/racket/collects/openssl/private"
          mkdir -p newcollects
          for f in rktcrypto-ffi.rkt rktcrypto-mzssl.rkt rktcrypto-win32-store.rkt; do
            curl -fsSL "$raw/$f" -o "newcollects/$f"
          done
          grep -q "librktcrypto" newcollects/rktcrypto-ffi.rkt
          # Overwrite every installed/built copy of the collects files; the
          # fresh mtimes make Racket ignore any stale .zo next to them.
          found=0
          while IFS= read -r dir; do
            found=1
            cp newcollects/*.rkt "$dir/"
            echo "updated: $dir"
          done < <(find "$src" -type d -path '*collects/openssl/private')
          test "$found" -eq 1
          # Put the DLL next to every Racket.exe so LoadLibrary finds it.
          while IFS= read -r exe; do
            cp dllbuild/librktcrypto.dll "$(dirname "$exe")/"
            echo "dll next to: $exe"
          done < <(find "$src" -iname Racket.exe)

      - name: TLS smoke (HARD; verified connect via win32 ROOT anchors)
        shell: pwsh
        run: |
          $racketExe = Get-ChildItem $env:SRC_DIR -Recurse -Filter Racket.exe | Sort-Object FullName | Select-Object -First 1
          if (!$racketExe) { throw "Racket.exe not found after build" }
          Write-Host "Using: $($racketExe.FullName)"
          $smoke = @'
          #lang racket/base
          (require openssl net/url racket/port
                   (only-in openssl/private/rktcrypto-win32-store win32-store-ders))
          (printf "ssl-available? = ~a\n" ssl-available?)
          (unless ssl-available? (error 'poc "ssl-available? is #f: librktcrypto.dll not loaded"))
          (define anchors (win32-store-ders 'poc "ROOT"))
          (printf "win32 ROOT anchors: ~a\n" (length anchors))
          (unless (> (length anchors) 20) (error 'poc "suspiciously few ROOT anchors"))
          (define-values (i o) (ssl-connect "example.com" 443 'secure))
          (write-string "GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n" o)
          (flush-output o)
          (define status (read-line i))
          (printf "ssl-connect 'secure response: ~a\n" status)
          (close-input-port i) (close-output-port o)
          (unless (regexp-match? #rx"200" status) (error 'poc "unexpected HTTPS status" status))
          (define body (port->string (get-pure-port (string->url "https://example.com/"))))
          (printf "net/url https body length: ~a\n" (string-length body))
          (unless (> (string-length body) 0) (error 'poc "empty https body via net/url"))
          (displayln "poc-rktcrypto-win-tls-ok")
          '@
          Set-Content -Path smoke.rkt -Value $smoke -Encoding UTF8
          & $racketExe.FullName smoke.rkt | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "smoke script failed with exit $LASTEXITCODE" }
          if (($out -join "`n") -notmatch 'poc-rktcrypto-win-tls-ok') { throw "smoke did not reach final ok marker" }
          Write-Host "PoC OK: verified TLS on Windows ${{ matrix.arch }} via rktcrypto DLL + win32 ROOT anchors, zero OpenSSL."
