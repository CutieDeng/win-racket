# Hand-maintained (NOT generated by package-racket). Updates the notes of an
# existing release from release-notes/<tag>.md using the workflow token,
# since local personal tokens have no write access to this repository.

name: release notes

on:
  push:
    branches:
      - main
    paths:
      - 'release-notes/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes from files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in release-notes/*.md; do
            tag=$(basename "$f" .md)
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file "$f"
              echo "updated notes: $tag"
            else
              echo "release does not exist yet, skipping: $tag"
            fi
          done
