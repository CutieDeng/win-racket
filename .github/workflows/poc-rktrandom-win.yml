# PoC (experimental, hand-authored — NOT generated by package-racket).
# Goal: verify that librktrandom static-links into the MSVC-built Racket on
# BOTH Windows arches once the fork's Windows gate is flipped (overlay commit
# below: cs/c/build.zuo `rktrandom? #t` + boot.c includes rktrandom.inc on
# WIN32), that `rktrandom-available?` is #t, that the C known-answer selftest
# passes, and — the strongest check — that the whole rgen surface produces
# BIT-IDENTICAL output to the macOS reference transcript captured from the
# same fork commit (poc/rktrandom-reference.txt). Success here means
# racket/random/generator reaches full Windows/Unix parity with zero new
# runtime artifacts (no DLL: unlike librktcrypto, the rktrandom C is portable
# C99 that MSVC can compile directly).

name: poc rktrandom win

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/poc-rktrandom-win.yml'
      - 'poc/rktrandom-smoke.rkt'
      - 'poc/rktrandom-reference.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_VERSION: '9.3.2'
  SOURCE_URL: 'https://github.com/CutieDeng/racket/releases/download/v9.3.2/racket-minimal-9.3.2-src.tgz'
  SOURCE_SHA256: '2499b909816914168e0c61d22da7274dbc503ef3dcff32d9811c24b3a7d1d360'
  # Fork commit flipping the rktrandom Windows gate (cs/c/build.zuo + boot.c).
  OVERLAY_COMMIT: '4d339221c0115c402fbfd2386df139e04fb164ac'
  BUILD_JOBS: '2'
  NMAKE_TARGET: 'plain-install'

jobs:
  poc-rktrandom:
    name: rktrandom ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            msvc_arch: x64
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
    env:
      MSVC_ARCH: ${{ matrix.msvc_arch }}
    steps:
      - name: Checkout (poc smoke script + reference transcript)
        uses: actions/checkout@v4

      - name: Locate Visual Studio build tools
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw "Visual Studio was not found" }
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsall)) { throw "vcvarsall.bat not found: $vcvarsall" }
          "VCVARSALL_BAT=$vcvarsall" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify source archive
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force source | Out-Null
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source.tgz
          $actual = (Get-FileHash source.tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_SHA256) { throw "Source sha256 mismatch: expected $env:SOURCE_SHA256 got $actual" }
          tar -xzf source.tgz -C source
          $entries = @(Get-ChildItem source -Directory)
          if ($entries.Count -ne 1) { Get-ChildItem source | Format-Table -AutoSize; throw "source archive must contain exactly one top-level directory" }
          "SRC_DIR=$($entries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Overlay gate-flip files from pinned fork commit
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          raw="https://raw.githubusercontent.com/CutieDeng/racket/$OVERLAY_COMMIT/racket/src/cs/c"
          for f in build.zuo boot.c; do
            curl -fsSL "$raw/$f" -o "$src/src/cs/c/$f"
          done
          # sanity: the gate is flipped, boot.c registers rktrandom on WIN32,
          # and librktcrypto stays excluded
          grep -q '(define rktrandom? #t)' "$src/src/cs/c/build.zuo"
          grep -q '(define rktcrypto? (not windows?))' "$src/src/cs/c/build.zuo"
          grep -q '# include "rktrandom.inc"' "$src/src/cs/c/boot.c"
          awk '/#ifndef WIN32/{g=1} /#endif/{g=0} /rktcrypto\.inc/{if(!g)exit 1} /rktrandom\.inc/{if(g)exit 1}' "$src/src/cs/c/boot.c"

      - name: Build Racket with nmake (${{ matrix.msvc_arch }})
        shell: pwsh
        run: |
          $buildScript = @"
          @echo on
          call "%VCVARSALL_BAT%" %MSVC_ARCH%
          cd /d "%SRC_DIR%"
          if exist Makefile (
            echo Reusing existing top-level Makefile in %CD%
          ) else if exist src\winfig.bat (
            call src\winfig.bat
            if not exist Makefile ( echo winfig.bat did not create Makefile & dir & exit /b 1 )
          ) else (
            dir & echo Neither top-level Makefile nor src\winfig.bat exists & exit /b 1
          )
          for %%D in (bin lib share include etc) do ( if not exist "%%D" mkdir "%%D" )
          call :RunNmake all
          if errorlevel 1 exit /b %errorlevel%
          call :RunNmake %NMAKE_TARGET%
          if errorlevel 1 exit /b %errorlevel%
          goto after_nmake
          :RunNmake
          echo Running nmake target %*
          nmake /f Makefile %* JOBS=%BUILD_JOBS%
          exit /b %errorlevel%
          :after_nmake
          "@
          Set-Content -Path build-racket.cmd -Value $buildScript -Encoding ASCII
          cmd.exe /c build-racket.cmd
          if ($LASTEXITCODE -ne 0) { throw "nmake build failed with exit $LASTEXITCODE" }

      - name: rktrandom smoke (HARD; bit-identical to macOS reference)
        shell: bash
        run: |
          set -euxo pipefail
          src=$(cygpath -u "$SRC_DIR")
          exe=$(find "$src" -iname Racket.exe | sort | head -1)
          test -n "$exe"
          echo "Using: $exe"
          "$exe" poc/rktrandom-smoke.rkt > out.txt
          tr -d '\r' < out.txt > out.lf.txt
          grep -q '^rktrandom-available? #t$' out.lf.txt
          grep -q '^selftest 1$' out.lf.txt
          grep -q '^rktrandom-smoke-ok$' out.lf.txt
          # normalize the reference too: checkout's autocrlf makes it CRLF
          tr -d '\r' < poc/rktrandom-reference.txt > ref.lf.txt
          diff -u ref.lf.txt out.lf.txt
          echo "PoC OK: rktrandom on Windows ${{ matrix.arch }} is bit-identical to the macOS reference (same seed, all 6 algorithms, jumps/forks/distributions)."
